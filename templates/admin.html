<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Console | University Project Portal</title><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/university-theme.css"><link rel="stylesheet" href="/static/institutional-v4.css"><style>.adminmain{max-width:1200px;margin:auto;padding:30px 20px}.admincards{display:grid;grid-template-columns:1fr 1fr;gap:24px}.adminrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border-bottom:1px solid #ddd}.adminrow button{margin-left:6px}.adminrow select{min-width:115px}.adminrow small{display:block;color:#657}.adminrow .tools{display:flex;align-items:center;gap:6px}.adminrow input{width:150px}.adminlink{color:#f1dbad}@media(max-width:850px){.admincards{grid-template-columns:1fr}.adminrow{flex-wrap:wrap}}</style></head><body><header><div class="brand"><span class="university-logo">U</span><span>UNIVERSITY <span class="accent">ADMIN CONSOLE</span></span></div><a class="adminlink" href="/">← กลับหน้าระบบโครงงาน</a></header><main class="adminmain"><div class="hero"><div><p class="eyebrow">ADMINISTRATION</p><h1>ระบบหลังบ้านผู้ดูแล</h1><p class="muted">จัดการบัญชีผู้ใช้ สิทธิ์อาจารย์ และข้อมูลโครงงาน</p></div></div><div id="adminMessage" class="panel">กำลังตรวจสอบสิทธิ์...</div><div id="adminWorkspace" class="admincards" hidden><section class="panel"><h2>ผู้ใช้งานและสิทธิ์</h2><div id="adminUsers"></div></section><section class="panel"><h2>จัดการโครงงานทั้งหมด</h2><div id="adminProjects"></div></section></div><section class="panel" style="margin-top:24px" id="announcementAdmin" hidden><h2>จัดการประกาศ / แจ้งปรับปรุงระบบ</h2><p class="muted">เพิ่มข่าวพร้อมรูปภาพเพื่อแสดงบนหน้า Dashboard และหน้าประกาศ</p><form id="announcementForm"><label>หัวข้อประกาศ<input name="title" required maxlength="140"></label><label>ประเภท<select name="kind"><option value="news">ข่าวประชาสัมพันธ์</option><option value="maintenance">แจ้งปรับปรุงระบบ</option></select></label><label>รายละเอียด<textarea name="body" rows="3" maxlength="3000"></textarea></label><label>ภาพประกอบ<input type="file" name="image" accept="image/jpeg,image/png,image/webp"></label><button class="primary">เผยแพร่ประกาศ</button></form><div id="announcementAdminList"></div></section></main><div id="toast" role="status"></div><script src="/static/admin.js"></script><script src="/static/admin-v6.js"></script></body></html>
